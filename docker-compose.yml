# `docker compose up` starts the full local stack: db, backend API, worker, frontend dev server.
# Dev-only default credentials/secrets below are fine for local Docker use; anything
# deployed uses real secrets from a real .env (see .env.example), never these values.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_employee_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Chinki
      POSTGRES_DB: ai_employee
    ports:
      # Host port 5433 (not 5432) to avoid colliding with any other local Postgres.
      - "5433:5432"
    volumes:
      - ai_employee_db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_employee"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ai_employee_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:Chinki@db:5432/ai_employee
      JWT_SECRET: dev-only-change-me-this-is-not-a-real-secret-32bytes-plus
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ai_employee_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:Chinki@db:5432/ai_employee
      JWT_SECRET: dev-only-change-me-this-is-not-a-real-secret-32bytes-plus
      SCHEDULER_CHECK_INTERVAL_MINUTES: "60"
      SCHEDULER_DAILY_REPORT_HOUR: "8"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: ai_employee_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  ai_employee_db_data:
  frontend_node_modules:
